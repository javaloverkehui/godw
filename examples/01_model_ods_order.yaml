kind: Model
name: ods_order
layer: ods
description: 订单原始表（由采集接入，不由平台建表）
datasource: pg_dw
schema: ods
table: order
columns:
  - name: order_id
    type: bigint
    nullable: false
    comment: 订单号
  - name: user_id
    type: bigint
    nullable: false
    comment: 用户ID
  - name: amount
    type: decimal
    nullable: false
    comment: 订单金额
  - name: status
    type: string
    nullable: false
    comment: 订单状态
  - name: dt
    type: date
    nullable: false
    comment: 分区日期
primary_key: [order_id]
partition_by: [dt]
