kind: Model
name: dwd_order
layer: dwd
description: 订单明细，标准化状态并标记退款
owner: data-platform
tags: [core, trade]
datasource: pg_dw
schema: dwd
columns:
  - name: order_id
    type: bigint
    nullable: false
    comment: 订单号
  - name: user_id
    type: bigint
    nullable: false
    comment: 用户ID
  - name: amount
    type: decimal
    nullable: false
    comment: 订单金额，单位元
  - name: status
    type: string
    nullable: false
    comment: 标准化状态
  - name: is_refunded
    type: bool
    nullable: false
    comment: 是否退款
  - name: dt
    type: date
    nullable: false
    comment: 分区日期
primary_key: [order_id]
unique_key: [order_id]
partition_by: [dt]
indexes:
  - columns: [user_id, dt]
