<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GoDW · 数据仓库控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f8cff'/%3E%3Ctext x='16' y='23' font-size='19' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark">G</div>
      <div>
        <div class="brand-name">GoDW</div>
        <div class="brand-sub">Data Warehouse</div>
      </div>
    </div>

    <div class="nav-group">
      <div class="nav-title">总览</div>
      <div class="nav-item" data-route="overview" title="工作台"><i class="nav-dot"></i>工作台</div>
      <div class="nav-item" data-route="instances" title="运行实例"><i class="nav-dot"></i>运行实例</div>
      <div class="nav-item" data-route="runbook" title="运维中心：甘特、补数与批量操作"><i class="nav-dot"></i>运维中心</div>
      <div class="nav-item" data-route="ops" title="平台运维"><i class="nav-dot"></i>平台运维</div>
    </div>

    <div class="nav-group">
      <div class="nav-title">开发</div>
      <div class="nav-item" data-route="sources" title="数据源"><i class="nav-dot"></i>数据源</div>
      <div class="nav-item" data-route="datasets" title="表结构"><i class="nav-dot"></i>表结构</div>
      <div class="nav-item" data-route="models" title="模型设计"><i class="nav-dot"></i>模型设计</div>
      <div class="nav-item" data-route="pipelines" title="管道"><i class="nav-dot"></i>管道</div>
      <div class="nav-item" data-route="canvas" title="编排"><i class="nav-dot"></i>编排</div>
      <div class="nav-item" data-route="metrics" title="指标"><i class="nav-dot"></i>指标</div>
      <div class="nav-item" data-route="bi" title="BI 图表"><i class="nav-dot"></i>BI 图表</div>
      <div class="nav-item" data-route="dashboards" title="看板"><i class="nav-dot"></i>看板</div>
      <div class="nav-item" data-route="sql" title="自助查询：只读 SQL 控制台"><i class="nav-dot"></i>自助查询</div>
    </div>

    <div class="nav-group">
      <div class="nav-title">治理</div>
      <div class="nav-item" data-route="catalog" title="数据文档：字段、质量、血缘一页读完"><i class="nav-dot"></i>数据文档</div>
      <div class="nav-item" data-route="lineage" title="血缘"><i class="nav-dot"></i>血缘</div>
      <div class="nav-item" data-route="quality" title="质量"><i class="nav-dot"></i>质量</div>
      <div class="nav-item" data-route="governance" title="治理"><i class="nav-dot"></i>治理</div>
      <div class="nav-item" data-route="audit" title="审计"><i class="nav-dot"></i>审计</div>
    </div>

    <div class="side-foot">
      <div id="env-badge">dev</div>
      <div style="margin-top:4px" id="version-badge">—</div>
    </div>
  </aside>

  <div class="main">
    <!-- 环境条：只有非 dev 才显示，dev 不打扰 -->
    <div class="env-banner" id="env-banner"></div>
    <header class="topbar">
      <div class="crumb" id="crumb">工作台</div>
      <div class="topbar-actions">
        <div id="global-search" style="width:340px"></div>
        <div id="ws-host"></div>
        <!-- 1180px 以下只留图标：文字按钮在 1024 宽会被挤成「刷/新」两行 -->
        <button class="sm ghost theme-btn" id="theme-btn" title="切换主题（亮色 / 暗色）"><span class="ico">☀</span><span class="lbl">亮色</span></button>
        <button class="sm ghost" data-act="reload" title="刷新当前页"><span class="ico">↻</span><span class="lbl">刷新</span></button>
        <button class="sm primary" data-act="run-once" title="执行一轮排队实例"><span class="ico">▶</span><span class="lbl">执行一轮</span></button>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div id="toast-root"></div>
<div id="modal-root"></div>
<div id="drawer-root"></div>
<script src="/assets/components.js"></script>
<script src="/assets/chart.js"></script>
<script src="/assets/app.js"></script>
<script src="/assets/governance.js"></script>
<script src="/assets/canvas.js"></script>
<script src="/assets/designer.js"></script>
<script src="/assets/wizard.js"></script>
<script src="/assets/runbook.js"></script>
<script src="/assets/bi.js"></script>
<script src="/assets/catalog.js"></script>
</body>
</html>
