apiVersion: v1
kind: Secret
metadata:
  name: {{ include "godw.fullname" . }}-auth
  labels: {{- include "godw.labels" . | nindent 4 }}
type: Opaque
stringData:
  # 未显式提供时生成一个随机串，避免默认口令上线
  jwt-secret: {{ .Values.auth.jwtSecret | default (randAlphaNum 48) | quote }}
  {{- if .Values.auth.bootstrapPass }}
  bootstrap-pass: {{ .Values.auth.bootstrapPass | quote }}
  {{- end }}
---
{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "godw.fullname" . }}-postgresql
  labels: {{- include "godw.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.postgresql.auth.password | quote }}
{{- end }}
